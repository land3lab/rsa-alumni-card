<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSA 총동문회 전자명함</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="yeti" content="noindex, nofollow">
<meta property="og:title" content="RSA 총동문회 전자명함">
<meta property="og:description" content="동문 전자명함을 링크 하나로 주고받습니다.">
<style>
:root{--bg:#f7f7f5;--card:#fff;--line:#e3e2dd;--tx:#1f1f1e;--tx2:#6b6a65;--tx3:#9a9993;--ac:#185fa5;--acbg:#e6f1fb;--ok:#3b6d11;--okbg:#eaf3de;--warn:#854f0b;--warnbg:#faeeda;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
p.sub{font-size:13px;color:var(--tx2);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
label span.opt{font-weight:400;color:var(--tx3)}
input{width:100%;height:42px;padding:0 12px;font-size:15px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--tx);font-family:inherit}
input:focus{outline:none;border-color:var(--ac)}
button{font-family:inherit;font-size:15px;padding:11px 16px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:disabled{opacity:.5}
.full{width:100%}
.row{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--tx);cursor:pointer}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.chip.sm{font-size:12px;padding:5px 10px}
.badge{display:inline-block;font-size:12px;padding:4px 10px;border-radius:var(--r)}
.b-ac{background:var(--acbg);color:var(--ac)}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-mut{background:var(--bg);color:var(--tx2)}
.err{font-size:13px;color:#a32d2d;margin:8px 0 0;display:none}
.note{font-size:11px;color:var(--tx3);line-height:1.6;margin:14px 0 0}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--acbg);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
table{width:100%;font-size:14px;border-collapse:collapse}
td{padding:6px 0;vertical-align:top}
td.k{color:var(--tx2);white-space:nowrap}
td.v{text-align:right;word-break:break-word}
.hr{border-top:1px solid var(--line);margin:14px 0}
.linkbox{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;word-break:break-all;color:var(--tx2);margin:12px 0}
.back{font-size:14px;color:var(--ac);background:none;border:none;padding:0;margin:0 0 14px;cursor:pointer}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:6px;background:var(--ac)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:none}
.stat{background:var(--bg);border-radius:var(--r);padding:14px;flex:1}
.stat b{display:block;font-size:24px;font-weight:600;margin-top:2px}
.demo{background:var(--warnbg);color:var(--warn);font-size:12px;padding:8px 12px;border-radius:var(--r);margin-bottom:16px}
.agree{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:12px;color:var(--tx2);line-height:1.7;max-height:190px;overflow-y:auto}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin-top:2px}
.spin{text-align:center;color:var(--tx3);font-size:14px;padding:30px 0}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin">불러오는 중…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var SB = supabase.createClient(
  "https://ypxnfktgrycflfypashh.supabase.co",
  "sb_publishable_oCcDOEMyqqLtHBiQJJr79Q_nq2Fxjha"
);
var JOBS=["개업공인중개사","소속공인중개사","개업준비중","일반직장근무","취업준비중","투자자","기타"];
var AREAS=["서울남부","서울동부","서울북부","서울서부","경기남부","경기북부","경기서부","인천","충청","대구경북","부산경남","전라","강원"];
var FIELDS=["주거용(아파트)","주거용(빌라 등)","주거용(오피스텔)","상업용","토지","건물중개","공장","창고","컨설팅","경매"];
var FORUMS=["AI포럼","경매포럼","드론포럼","산악포럼","골프포럼"];
var AGREE='<b>RSA 총동문회 전자명함 개인정보 수집·이용 동의</b><br><br><b>수집·이용 목적</b><br>동문 전자명함 제작과 대외 공개<br><br><b>수집 항목</b><br>명단에서 가져오는 항목: 성명, 기수<br>본인이 입력하는 항목: 상호·직함, 구분, 활동지역, 전문분야, 연락처, 블로그·유튜브 주소, 개설등록번호(선택)<br><br><b>공개 범위</b><br>명함 링크를 받은 사람은 누구나 볼 수 있고, 동문이 아닌 사람도 포함됩니다. 명함첩에도 함께 실립니다. 다만 검색엔진에는 수집되지 않도록 차단되어 있습니다.<br><br><b>보유·이용 기간</b><br>명함을 비활성화하거나 동문 자격을 잃은 때로부터 1개월 이내에 폐기합니다.<br><br><b>관리 주체</b><br>RSA 총동문회 사무국<br><br><b>동의를 거부할 권리</b><br>동의하지 않으셔도 동문 자격과 명단 등재에는 아무 영향이 없습니다. 전자명함만 만들 수 없습니다.<br><br><b>철회 방법</b><br>사무국(길문수 010-2611-7548)으로 요청하시면 명함 링크를 닫습니다. 이미 보내진 링크도 그때부터 열리지 않습니다. 다만 상대방이 화면을 저장해 둔 경우까지는 회수할 수 없습니다.';
var app=document.getElementById("app"), S={};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function url(u){u=String(u||"").trim();return !u?"":(/^https?:\/\//i.test(u)?u:"https://"+u)}
function go(h){location.hash=h}
function busy(m){app.innerHTML='<div class="spin">'+(m||"잠시만요…")+'</div>'}

function viewHome(){
 app.innerHTML='<h1>RSA 총동문회 전자명함</h1><p class="sub">동문 명함을 링크 하나로 주고받습니다. 앱 설치도 회원가입도 없습니다.</p>'
 +'<div class="demo">시범 운영 중입니다. 명단은 테스트용 5명만 들어 있습니다.</div>'
 +'<div class="card"><h2>내 명함 만들기</h2><p class="sub" style="margin-bottom:14px">사무국에서 받은 초대코드로 시작합니다.</p><button class="pri full" onclick="go(\'#create\')">시작하기</button></div>'
 +'<div class="card" style="margin-top:12px"><h2>동문 명함첩</h2><p class="sub" style="margin-bottom:14px">지역·기수·분야로 동문을 찾습니다.</p><button class="full" onclick="go(\'#book\')">명함첩 열기</button></div>'
 +'<div class="card" style="margin-top:12px"><h2>사무국 관리</h2><p class="sub" style="margin-bottom:14px">발급 현황과 명함 회수.</p><button class="full" onclick="go(\'#admin\')">관리 화면</button></div>'
 +'<p class="note">테스트 초대코드: RSA-9-2038 · RSA-10-7712 · RSA-8-4471</p>';
}

function viewCreate(){
 app.innerHTML='<button class="back" onclick="go(\'\')">← 처음으로</button><h1>명함 만들기</h1><p class="sub">1단계 · 초대코드 확인</p>'
 +'<div class="card"><label>초대코드</label><input id="code" placeholder="RSA-9-2038" autocapitalize="characters">'
 +'<p class="err" id="e1">명단에서 찾을 수 없는 코드입니다</p>'
 +'<button class="pri full" id="btn" style="margin-top:16px" onclick="checkCode()">확인</button></div>'
 +'<p class="note">코드는 사무국이 동문 명단에서 발급합니다. 정회원이 아니어도 동문이면 만들 수 있습니다.</p>';
}
async function checkCode(){
 var v=document.getElementById("code").value.trim();
 var b=document.getElementById("btn"); b.disabled=true; b.textContent="확인 중…";
 var r=await SB.rpc("redeem_invite",{p_code:v});
 b.disabled=false; b.textContent="확인";
 if(r.error||!r.data||!r.data.length){document.getElementById("e1").style.display="block";return}
 var m=r.data[0];
 S={aid:m.alumni_id,name:m.name,cohort:m.cohort,job:null,fields:[],forums:[],area:null};
 go("#agree");
}

function viewAgree(){
 if(!S.name){go("#create");return}
 app.innerHTML='<button class="back" onclick="go(\'#create\')">← 코드 다시 입력</button><h1>공개 동의</h1><p class="sub">2단계 · '+esc(S.name)+' 동문 · '+esc(S.cohort)+'기</p>'
 +'<div class="card"><div class="agree">'+AGREE+'</div>'
 +'<label class="chk"><input type="checkbox" id="ag"><span>위 내용을 확인했고, 명함에 실릴 내용이 동문이 아닌 사람에게도 공개되는 데 동의합니다.</span></label>'
 +'<p class="err" id="e0">동의하셔야 다음으로 넘어갑니다</p>'
 +'<button class="pri full" style="margin-top:16px" onclick="okAgree()">동의하고 계속</button></div>';
}
function okAgree(){
 if(!document.getElementById("ag").checked){document.getElementById("e0").style.display="block";return}
 S.agreed=true;go("#form");
}

function viewForm(){
 if(!S.agreed){go("#create");return}
 app.innerHTML='<button class="back" onclick="go(\'#agree\')">← 이전</button><h1>'+esc(S.name)+' 동문</h1><p class="sub">3단계 · '+esc(S.cohort)+'기 · 명함에 실을 내용</p>'
 +'<div class="card">'
 +'<label>상호 · 직함</label><input id="f_org" placeholder="대표 · 미래공인중개사사무소">'
 +'<label>구분</label><div class="chips" id="jw"></div>'
 +'<label>활동지역</label><div class="chips" id="aw"></div>'
 +'<label>세부지역 <span class="opt">· 선택</span></label><input id="f_area2" placeholder="관악구 봉천동">'
 +'<label>전문분야 <span class="opt">· 최대 4개</span></label><div class="chips" id="fw"></div><p class="err" id="e3">4개까지만 고를 수 있어요</p>'
 +'<label>참여 포럼 <span class="opt">· 선택</span></label><div class="chips" id="pw"></div>'
 +'<label>연락처</label><input id="f_tel" type="tel" placeholder="010-0000-0000">'
 +'<label>블로그 <span class="opt">· 선택</span></label><input id="f_blog" placeholder="blog.naver.com/아이디">'
 +'<label>유튜브 <span class="opt">· 선택</span></label><input id="f_yt" placeholder="youtube.com/@채널">'
 +'<label>개설등록번호 <span class="opt">· 선택</span></label><input id="f_reg" placeholder="11620-2024-00000">'
 +'<p class="err" id="e2">상호·직함, 구분, 활동지역, 연락처는 반드시 채워 주세요</p>'
 +'<button class="pri full" id="mk" style="margin-top:18px" onclick="makeCard()">명함 만들기</button></div>'
 +'<p class="note">이름과 기수는 총동문회 명단에서 확인한 값이라 고칠 수 없습니다. 개별 매물은 명함에 표시하지 않습니다.</p>';
 drawChips();
}
function mkChips(el,list,sel,fn){el.innerHTML="";list.forEach(function(t){var b=document.createElement("button");b.className="chip"+(sel(t)?" on":"");b.textContent=t;b.onclick=function(){fn(t)};el.appendChild(b)})}
function drawChips(){
 mkChips(document.getElementById("jw"),JOBS,function(t){return S.job===t},function(t){S.job=(S.job===t?null:t);drawChips()});
 mkChips(document.getElementById("aw"),AREAS,function(t){return S.area===t},function(t){S.area=(S.area===t?null:t);drawChips()});
 mkChips(document.getElementById("fw"),FIELDS,function(t){return S.fields.indexOf(t)>-1},function(t){
   var e=document.getElementById("e3"),i=S.fields.indexOf(t);
   if(i>-1){S.fields.splice(i,1);e.style.display="none"}
   else if(S.fields.length>=4){e.style.display="block";return}
   else{S.fields.push(t);e.style.display="none"}
   drawChips()});
 mkChips(document.getElementById("pw"),FORUMS,function(t){return S.forums.indexOf(t)>-1},function(t){
   var i=S.forums.indexOf(t); if(i>-1)S.forums.splice(i,1); else S.forums.push(t); drawChips()});
}

async function makeCard(){
 var g=function(i){return document.getElementById(i).value.trim()};
 if(!g("f_org")||!S.job||!S.area||!g("f_tel")){document.getElementById("e2").style.display="block";return}
 var b=document.getElementById("mk"); b.disabled=true; b.textContent="만드는 중…";
 var r=await SB.rpc("create_card",{p_alumni_id:S.aid,p_org:g("f_org"),p_job:S.job,p_region:S.area,
   p_region_detail:g("f_area2"),p_fields:S.fields,p_forums:S.forums,p_tel:g("f_tel"),
   p_blog:g("f_blog"),p_youtube:g("f_yt"),p_reg_no:g("f_reg")});
 if(r.error){b.disabled=false;b.textContent="명함 만들기";alert("저장에 실패했습니다: "+r.error.message);return}
 S.slug=r.data; go("#done");
}

function cardUrl(slug){return location.origin+location.pathname+"#c="+slug}

async function viewDone(){
 if(!S.slug){go("#create");return}
 busy("명함을 불러오는 중…");
 var r=await SB.from("cards").select("*").eq("slug",S.slug).single();
 var u=cardUrl(S.slug);
 app.innerHTML='<h1>명함이 만들어졌습니다</h1><p class="sub">아래 주소를 보내면 상대방이 바로 열어봅니다.</p>'
 +renderCard(r.data,false)
 +'<div class="linkbox">'+esc(u)+'</div>'
 +'<div class="row"><button class="pri" style="flex:1" onclick="share()">공유하기</button><button style="flex:1" onclick="copy()">주소 복사</button></div>'
 +'<button class="full" style="margin-top:8px" onclick="go(\'#book\')">명함첩 보기</button>'
 +'<p class="note" id="cp">주소가 짧아졌습니다. 명함 내용은 서버에 저장돼 있어서, 나중에 사무국이 회수하면 이 링크도 닫힙니다.</p>';
}
function share(){var u=cardUrl(S.slug);if(navigator.share)navigator.share({title:"RSA 동문 전자명함",url:u}).catch(function(){});else copy()}
function copy(){navigator.clipboard.writeText(cardUrl(S.slug)).then(function(){document.getElementById("cp").textContent="주소를 복사했습니다. 카톡이나 문자에 붙여넣어 보내세요."})}

function renderCard(d,pub){
 if(!d)return '<div class="card"><h2>열 수 없는 명함입니다</h2><p class="sub" style="margin:0">회수되었거나 주소가 잘못되었습니다.</p></div>';
 var tags=(d.fields||[]).map(function(t){return '<span class="badge b-ac" style="margin:0 4px 4px 0">'+esc(t)+'</span>'}).join("");
 var links="";
 if(d.blog)links+='<a href="'+esc(url(d.blog))+'" style="color:var(--ac);text-decoration:none">블로그</a>';
 if(d.youtube)links+=(links?" · ":"")+'<a href="'+esc(url(d.youtube))+'" style="color:var(--ac);text-decoration:none">유튜브</a>';
 var isB=(d.job==="개업공인중개사"||d.job==="소속공인중개사");
 var foot=isB?"기수·성명은 RSA 총동문회 명단에서 확인한 값이며, 그 밖의 항목은 본인이 입력했습니다. 총동문회는 개인의 자격이나 중개행위를 보증하지 않습니다."
             :"기수·성명은 RSA 총동문회 명단에서 확인한 값이며, 그 밖의 항목은 본인이 입력했습니다. 이 동문은 공인중개사사무소 개설등록 정보를 등록하지 않았습니다.";
 return '<div class="card">'
 +'<div style="display:flex;gap:12px;align-items:center"><div class="avatar">'+esc(String(d.name).slice(0,2))+'</div>'
 +'<div><div style="font-size:20px;font-weight:600">'+esc(d.name)+'</div><div style="font-size:13px;color:var(--tx2)">'+esc(d.org)+'</div></div></div>'
 +'<div style="margin:12px 0"><span class="badge b-ac">RSA '+esc(d.cohort)+'기</span> <span class="badge b-ok">동문 확인</span> <span class="badge b-mut">'+esc(d.job)+'</span></div>'
 +'<div class="hr"></div><table>'
 +'<tr><td class="k">활동지역</td><td class="v">'+esc(d.region)+(d.region_detail?" · "+esc(d.region_detail):"")+'</td></tr>'
 +(tags?'<tr><td class="k">전문분야</td><td class="v">'+tags+'</td></tr>':"")
 +((d.forums&&d.forums.length)?'<tr><td class="k">포럼</td><td class="v">'+esc(d.forums.join(" · "))+'</td></tr>':"")
 +'<tr><td class="k">연락처</td><td class="v"><a href="tel:'+esc(d.tel)+'" style="color:var(--ac);text-decoration:none">'+esc(d.tel)+'</a></td></tr>'
 +(links?'<tr><td class="k">채널</td><td class="v">'+links+'</td></tr>':"")
 +(d.reg_no?'<tr><td class="k">등록번호</td><td class="v">'+esc(d.reg_no)+'</td></tr>':"")
 +'</table>'
 +(pub?'<div class="row" style="margin-top:14px"><a href="tel:'+esc(d.tel)+'" style="flex:1;text-decoration:none"><button class="pri full">전화 걸기</button></a></div>':"")
 +'<p class="note">'+foot+'</p></div>';
}

async function viewPublic(slug){
 busy();
 var r=await SB.from("cards").select("*").eq("slug",slug).maybeSingle();
 app.innerHTML=renderCard(r.data,true)
 +'<div class="card" style="margin-top:12px"><h2>RSA 총동문회</h2><p class="sub" style="margin:0 0 12px">전국 동문이 함께하는 부동산 전문가 네트워크입니다.</p><button class="full" onclick="go(\'#book\')">동문 명함첩 보기</button></div>';
}

var BF={region:null,cohort:null,field:null};
async function viewBook(){
 busy("명함첩을 불러오는 중…");
 var q=SB.from("cards").select("*").is("revoked_at",null).order("created_at",{ascending:false}).limit(100);
 if(BF.region)q=q.eq("region",BF.region);
 if(BF.cohort)q=q.eq("cohort",BF.cohort);
 if(BF.field)q=q.contains("fields",[BF.field]);
 var r=await q;
 var list=r.data||[];
 var h='<button class="back" onclick="go(\'\')">← 처음으로</button><h1>동문 명함첩</h1><p class="sub">명함을 만든 동문 '+list.length+'명</p>'
 +'<div class="card" style="margin-bottom:12px"><label style="margin-top:0">지역</label><div class="chips" id="bw1"></div>'
 +'<label>분야</label><div class="chips" id="bw2"></div></div>';
 if(!list.length) h+='<div class="card"><p class="sub" style="margin:0">조건에 맞는 동문이 아직 없습니다.</p></div>';
 else h+='<div class="card">'+list.map(function(d){
   return '<div class="mrow" onclick="go(\'#c='+d.slug+'\')"><div><div style="font-size:15px;font-weight:600">'+esc(d.name)
   +' <span style="font-weight:400;font-size:12px;color:var(--tx3)">'+esc(d.cohort)+'기</span></div>'
   +'<div style="font-size:12px;color:var(--tx2)">'+esc(d.org)+'</div>'
   +'<div style="font-size:12px;color:var(--tx3)">'+esc(d.region)+((d.fields&&d.fields.length)?" · "+esc(d.fields.slice(0,2).join(", ")):"")+'</div></div>'
   +'<span style="color:var(--tx3)">›</span></div>'}).join("")+'</div>';
 app.innerHTML=h;
 mkChips(document.getElementById("bw1"),AREAS,function(t){return BF.region===t},function(t){BF.region=(BF.region===t?null:t);viewBook()});
 mkChips(document.getElementById("bw2"),FIELDS,function(t){return BF.field===t},function(t){BF.field=(BF.field===t?null:t);viewBook()});
 [].forEach.call(document.querySelectorAll("#bw1 .chip,#bw2 .chip"),function(b){b.className+=" sm"});
}

function viewAdmin(){
 app.innerHTML='<button class="back" onclick="go(\'\')">← 처음으로</button><h1>사무국 관리</h1><p class="sub">비밀번호를 입력하세요</p>'
 +'<div class="card"><label>비밀번호</label><input id="pin" type="password" placeholder="••••••">'
 +'<p class="err" id="ep">비밀번호가 맞지 않습니다</p>'
 +'<button class="pri full" style="margin-top:16px" onclick="adminIn()">들어가기</button></div>';
}
async function adminIn(){
 var pin=document.getElementById("pin").value.trim();
 var r=await SB.rpc("admin_stats",{p_pin:pin});
 if(r.error){document.getElementById("ep").style.display="block";return}
 S.pin=pin; renderAdmin(r.data);
}
async function renderAdmin(st){
 var c=await SB.from("cards").select("*").order("created_at",{ascending:false}).limit(50);
 var rows=(c.data||[]).map(function(d){
   var live=!d.revoked_at;
   return '<div class="mrow"><div style="min-width:0"><div style="font-size:14px;font-weight:600">'+esc(d.name)
   +' <span style="font-weight:400;font-size:12px;color:var(--tx3)">'+esc(d.cohort)+'기</span></div>'
   +'<div style="font-size:12px;color:var(--tx2)">'+esc(d.org)+' · '+esc(d.region)+'</div></div>'
   +(live?'<button class="chip sm" onclick="doRevoke(\''+d.slug+'\')">회수</button>':'<span class="badge b-mut">회수됨</span>')
   +'</div>'}).join("");
 app.innerHTML='<button class="back" onclick="go(\'\')">← 처음으로</button><h1>사무국 관리</h1><p class="sub">발급 현황과 명함 회수</p>'
 +'<div class="row" style="margin-bottom:12px"><div class="stat"><span style="font-size:13px;color:var(--tx2)">명단</span><b>'+st.alumni+'</b></div>'
 +'<div class="stat"><span style="font-size:13px;color:var(--tx2)">발급</span><b>'+st.issued+'</b></div>'
 +'<div class="stat"><span style="font-size:13px;color:var(--tx2)">회수</span><b>'+st.revoked+'</b></div></div>'
 +'<div class="card"><h2>기수별</h2>'+ (st.by_cohort||[]).map(function(r){
     return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--tx2)">'+r.cohort+'기</span><span>'+r.issued+' / '+r.total+'</span></div><div class="bar"><i style="width:'+(r.total?Math.round(r.issued/r.total*100):0)+'%"></i></div></div>'}).join("")
 +'</div><div class="card" style="margin-top:12px"><h2>발급된 명함</h2>'+(rows||'<p class="sub" style="margin:0">아직 없습니다.</p>')+'</div>'
 +'<p class="note">회수는 되돌릴 수 없습니다. 재가입 시에는 새 명함을 발급하세요. 회수 기록은 서버에 남습니다.</p>';
}
async function doRevoke(slug){
 if(!confirm("이 명함을 회수하시겠습니까? 되돌릴 수 없습니다."))return;
 var r=await SB.rpc("revoke_card",{p_slug:slug,p_pin:S.pin,p_note:null});
 if(r.error){alert("회수에 실패했습니다: "+r.error.message);return}
 var st=await SB.rpc("admin_stats",{p_pin:S.pin}); renderAdmin(st.data);
}

function route(){
 var h=location.hash.slice(1); window.scrollTo(0,0);
 if(h.indexOf("c=")===0)return viewPublic(h.slice(2));
 if(h==="create")return viewCreate();
 if(h==="agree")return viewAgree();
 if(h==="form")return viewForm();
 if(h==="done")return viewDone();
 if(h==="book")return viewBook();
 if(h==="admin")return viewAdmin();
 viewHome();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
