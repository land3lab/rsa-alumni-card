<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSA 총동문회 전자명함</title>
<meta property="og:title" content="RSA 총동문회 전자명함">
<meta property="og:description" content="동문 전자명함을 링크 하나로 주고받습니다.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="naverbot" content="noindex, nofollow">
<meta name="yeti" content="noindex, nofollow">
<style>
:root{--bg:#f7f7f5;--card:#fff;--line:#e3e2dd;--tx:#1f1f1e;--tx2:#6b6a65;--tx3:#9a9993;--ac:#185fa5;--acbg:#e6f1fb;--ok:#3b6d11;--okbg:#eaf3de;--warn:#854f0b;--warnbg:#faeeda;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
p.sub{font-size:13px;color:var(--tx2);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
label span.opt{font-weight:400;color:var(--tx3)}
input{width:100%;height:42px;padding:0 12px;font-size:15px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--tx);font-family:inherit}
input:focus{outline:none;border-color:var(--ac)}
button{font-family:inherit;font-size:15px;padding:11px 16px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:active{transform:scale(.99)}
.full{width:100%}
.row{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--tx);cursor:pointer}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.badge{display:inline-block;font-size:12px;padding:4px 10px;border-radius:var(--r)}
.b-ac{background:var(--acbg);color:var(--ac)}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-mut{background:var(--bg);color:var(--tx2)}
.err{font-size:13px;color:#a32d2d;margin:8px 0 0;display:none}
.note{font-size:11px;color:var(--tx3);line-height:1.6;margin:14px 0 0}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--acbg);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
table{width:100%;font-size:14px;border-collapse:collapse}
td{padding:6px 0;vertical-align:top}
td.k{color:var(--tx2);white-space:nowrap}
td.v{text-align:right;word-break:break-word}
.hr{border-top:1px solid var(--line);margin:14px 0}
.linkbox{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px;word-break:break-all;color:var(--tx2);margin:12px 0}
.back{font-size:14px;color:var(--ac);background:none;border:none;padding:0;margin:0 0 14px;cursor:pointer}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:6px;background:var(--ac)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.stat{background:var(--bg);border-radius:var(--r);padding:14px;flex:1}
.stat b{display:block;font-size:24px;font-weight:600;margin-top:2px}
.demo{background:var(--warnbg);color:var(--warn);font-size:12px;padding:8px 12px;border-radius:var(--r);margin-bottom:16px}
.agree{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:12px;color:var(--tx2);line-height:1.7;max-height:190px;overflow-y:auto}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin-top:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var ROSTER={
 "RSA-8-2038":{name:"김상호",cohort:"8기"},
 "RSA-9-7712":{name:"박연우",cohort:"9기"},
 "RSA-10-4471":{name:"이정민",cohort:"10기"}
};
var JOBS=["개업공인중개사","소속공인중개사","개업준비중","일반직장근무","취업준비중","투자자","기타"];
var AREAS=["서울남부","서울동부","서울북부","서울서부","경기남부","경기북부","경기서부","인천","충청","대구경북","부산경남","전라","강원"];
var FIELDS=["주거용(아파트)","주거용(빌라 등)","주거용(오피스텔)","상업용","토지","건물중개","공장","창고","컨설팅","경매"];
var FORUMS=["AI포럼","경매포럼","드론포럼","산악포럼","골프포럼"];
var app=document.getElementById("app");
var S={};

function enc(o){var s=JSON.stringify(o);var b=new TextEncoder().encode(s);var t="";for(var i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(x){try{var t=x.replace(/-/g,"+").replace(/_/g,"/");var s=atob(t);var b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(b))}catch(e){return null}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function url(u){u=String(u||"").trim();if(!u)return"";return /^https?:\/\//i.test(u)?u:"https://"+u}
function go(h){location.hash=h}

function viewHome(){
 app.innerHTML='<h1>RSA 총동문회 전자명함</h1><p class="sub">동문 명함을 링크 하나로 주고받습니다. 앱 설치도 회원가입도 없습니다.</p>'
 +'<div class="demo">시범 운영 화면입니다. 명단은 데모 3명만 들어 있고, 카톡 인증은 사무국 초대코드로 대체돼 있습니다.</div>'
 +'<div class="card"><h2>내 명함 만들기</h2><p class="sub" style="margin-bottom:14px">사무국에서 받은 초대코드로 시작합니다.</p><button class="pri full" onclick="go(\'#create\')">시작하기</button></div>'
 +'<div class="card" style="margin-top:12px"><h2>사무국 관리</h2><p class="sub" style="margin-bottom:14px">명단·발급 현황·명함 회수.</p><button class="full" onclick="go(\'#admin\')">관리 화면 열기</button></div>'
 +'<p class="note">데모 초대코드: RSA-8-2038 · RSA-9-7712 · RSA-10-4471</p>';
}

function viewCreate(){
 app.innerHTML='<button class="back" onclick="go(\'\')">← 처음으로</button><h1>명함 만들기</h1><p class="sub">1단계 · 초대코드 확인</p>'
 +'<div class="card"><label>초대코드</label><input id="code" placeholder="RSA-5-2038" autocapitalize="characters">'
 +'<p class="err" id="e1">명단에서 찾을 수 없는 코드입니다</p>'
 +'<button class="pri full" style="margin-top:16px" onclick="checkCode()">확인</button></div>'
 +'<p class="note">코드는 사무국이 동문 명단에서 발급합니다. 정회원이 아니어도 동문이면 만들 수 있습니다. 코드를 분실하셨으면 사무국에 요청해 주세요.</p>';
}
function checkCode(){
 var v=document.getElementById("code").value.trim().toUpperCase();
 var m=ROSTER[v];
 if(!m){document.getElementById("e1").style.display="block";return}
 S={name:m.name,cohort:m.cohort,job:null,fields:[],area:null,forums:[]};
 go("#agree");
}

function viewAgree(){
 if(!S.name){go("#create");return}
 app.innerHTML='<button class="back" onclick="go(\'#create\')">← 코드 다시 입력</button><h1>공개 동의</h1><p class="sub">2단계 · '+esc(S.name)+' 동문 · '+esc(S.cohort)+'</p>'
 +'<div class="card"><div class="agree" id="agtext"><b>RSA 총동문회 전자명함 개인정보 수집·이용 동의</b><br><br><b>수집·이용 목적</b><br>동문 전자명함 제작과 대외 공개<br><br><b>수집 항목</b><br>연명부에서 가져오는 항목: 성명, 기수<br>본인이 입력하는 항목: 상호·직함, 구분, 활동지역, 전문분야, 연락처, 블로그·유튜브 주소, 개설등록번호(선택)<br><br><b>공개 범위</b><br>명함 링크를 받은 사람은 누구나 볼 수 있고, 동문이 아닌 사람도 포함됩니다. 받은 사람이 다시 다른 사람에게 전달할 수도 있습니다. 다만 명함 페이지는 검색엔진에 수집되지 않도록 차단되어 있어, 구글·네이버 검색으로는 찾을 수 없습니다.<br><br><b>보유·이용 기간</b><br>명함을 비활성화하거나 동문 자격을 잃은 때로부터 1개월 이내에 폐기합니다.<br><br><b>관리 주체</b><br>RSA 총동문회 사무국<br><br><b>동의를 거부할 권리</b><br>동의하지 않으셔도 동문 자격과 연명부 등재에는 아무 영향이 없습니다. 전자명함만 만들 수 없습니다.<br><br><b>철회 방법</b><br>사무국(길문수 010-2611-7548)으로 요청하시면 명함 링크를 닫습니다. 이미 보내진 링크도 그때부터 열리지 않습니다. 다만 상대방이 화면을 저장해 둔 경우까지는 회수할 수 없습니다.</div>'
 +'<label class="chk"><input type="checkbox" id="ag"><span>위 내용을 확인했고, 명함에 실릴 내용이 동문이 아닌 사람에게도 공개되는 데 동의합니다.</span></label>'
 +'<p class="err" id="e0">동의하셔야 다음으로 넘어갑니다</p>'
 +'<button class="pri full" style="margin-top:16px" onclick="okAgree()">동의하고 계속</button></div>'
 +'<p class="note">연명부에 이미 하신 동의는 동문 대상 안내용입니다. 전자명함은 외부에 공개되므로 동의를 따로 받습니다.</p>';
}
function okAgree(){
 if(!document.getElementById("ag").checked){document.getElementById("e0").style.display="block";return}
 S.agreed=true;go("#form");
}

function viewForm(){
 if(!S.agreed){go("#create");return}
 app.innerHTML='<button class="back" onclick="go(\'#agree\')">← 이전</button><h1>'+esc(S.name)+' 동문</h1><p class="sub">3단계 · '+esc(S.cohort)+' · 명함에 실을 내용을 채워 주세요</p>'
 +'<div class="card">'
 +'<label>상호 · 직함</label><input id="f_org" placeholder="대표 · 미래공인중개사사무소">'
 +'<label>구분</label><div class="chips" id="jw"></div>'
 +'<label>활동지역</label><div class="chips" id="aw"></div>'
 +'<label>세부지역 <span class="opt">· 선택</span></label><input id="f_area2" placeholder="관악구 봉천동">'
 +'<label>전문분야 <span class="opt">· 최대 4개</span></label><div class="chips" id="fw"></div><p class="err" id="e3">4개까지만 고를 수 있어요</p>'
 +'<label>참여 포럼 <span class="opt">· 선택</span></label><div class="chips" id="pw"></div>'
 +'<label>연락처</label><input id="f_tel" type="tel" placeholder="010-0000-0000">'
 +'<label>블로그 <span class="opt">· 선택</span></label><input id="f_blog" placeholder="blog.naver.com/아이디">'
 +'<label>유튜브 <span class="opt">· 선택</span></label><input id="f_yt" placeholder="youtube.com/@채널">'
 +'<label>개설등록번호 <span class="opt">· 선택</span></label><input id="f_reg" placeholder="11620-2024-00000">'
 +'<p class="err" id="e2">상호·직함, 구분, 활동지역, 연락처는 반드시 채워 주세요</p>'
 +'<button class="pri full" style="margin-top:18px" onclick="makeCard()">명함 만들기</button></div>'
 +'<p class="note">이름과 기수는 총동문회 연명부에서 확인한 값이라 고칠 수 없습니다. 나머지는 본인이 입력하는 항목입니다. 개별 매물은 명함에 표시하지 않습니다.</p>';
 drawChips();
}

function drawChips(){
 var jw=document.getElementById("jw");jw.innerHTML="";
 JOBS.forEach(function(t){var b=document.createElement("button");b.className="chip"+(S.job===t?" on":"");b.textContent=t;
  b.onclick=function(){S.job=(S.job===t?null:t);drawChips()};jw.appendChild(b)});
 var aw=document.getElementById("aw");aw.innerHTML="";
 AREAS.forEach(function(t){var b=document.createElement("button");b.className="chip"+(S.area===t?" on":"");b.textContent=t;
  b.onclick=function(){S.area=(S.area===t?null:t);drawChips()};aw.appendChild(b)});
 var fw=document.getElementById("fw");fw.innerHTML="";
 FIELDS.forEach(function(t){var on=S.fields.indexOf(t)>-1;var b=document.createElement("button");b.className="chip"+(on?" on":"");b.textContent=t;
  b.onclick=function(){var e=document.getElementById("e3");
   if(on){S.fields.splice(S.fields.indexOf(t),1);e.style.display="none"}
   else if(S.fields.length>=4){e.style.display="block";return}
   else{S.fields.push(t);e.style.display="none"}
   drawChips()};fw.appendChild(b)});
 var pw=document.getElementById("pw");pw.innerHTML="";
 FORUMS.forEach(function(t){var on=S.forums.indexOf(t)>-1;var b=document.createElement("button");b.className="chip"+(on?" on":"");b.textContent=t;
  b.onclick=function(){if(on)S.forums.splice(S.forums.indexOf(t),1);else S.forums.push(t);drawChips()};pw.appendChild(b)});
}

function makeCard(){
 var g=function(i){return document.getElementById(i).value.trim()};
 var d={n:S.name,c:S.cohort,o:g("f_org"),j:S.job,ar:S.area,a2:g("f_area2"),f:S.fields,p:S.forums,t:g("f_tel"),bl:g("f_blog"),yt:g("f_yt"),r:g("f_reg")};
 if(!d.o||!d.j||!d.ar||!d.t){document.getElementById("e2").style.display="block";return}
 S.card=d;go("#done");
}
function cardUrl(d){return location.origin+location.pathname+"#c="+enc(d)}

function viewDone(){
 if(!S.card){go("#create");return}
 var u=cardUrl(S.card);
 app.innerHTML='<h1>명함이 만들어졌습니다</h1><p class="sub">아래 주소를 보내면 상대방이 바로 열어봅니다.</p>'
 +renderCard(S.card,false)
 +'<div class="linkbox">'+esc(u)+'</div>'
 +'<div class="row"><button class="pri" style="flex:1" onclick="share()">공유하기</button><button style="flex:1" onclick="copy()">주소 복사</button></div>'
 +'<button class="full" style="margin-top:8px" onclick="go(\'#form\')">내용 고치기</button>'
 +'<p class="note" id="cp">이 주소에 명함 내용이 담겨 있습니다. 내용을 고치면 새 주소가 만들어지니, 고친 뒤에는 새 주소를 다시 보내 주세요.</p>';
}
function share(){var u=cardUrl(S.card);if(navigator.share){navigator.share({title:"RSA 동문 전자명함",text:S.card.n+" 동문 명함",url:u}).catch(function(){})}else copy()}
function copy(){var u=cardUrl(S.card);navigator.clipboard.writeText(u).then(function(){document.getElementById("cp").textContent="주소를 복사했습니다. 카톡이나 문자에 붙여넣어 보내세요."})}

function renderCard(d,pub){
 var tags=(d.f||[]).map(function(t){return '<span class="badge b-ac" style="margin:0 4px 4px 0">'+esc(t)+'</span>'}).join("");
 var area=esc(d.ar)+(d.a2?" · "+esc(d.a2):"");
 var links="";
 if(d.bl)links+='<a href="'+esc(url(d.bl))+'" style="color:var(--ac);text-decoration:none">블로그</a>';
 if(d.yt)links+=(links?" · ":"")+'<a href="'+esc(url(d.yt))+'" style="color:var(--ac);text-decoration:none">유튜브</a>';
 var isB=(d.j==="개업공인중개사"||d.j==="소속공인중개사");
 var foot=isB?"기수·성명은 RSA 총동문회 연명부에서 확인한 값이며, 그 밖의 항목은 본인이 입력했습니다. 총동문회는 개인의 자격이나 중개행위를 보증하지 않습니다."
             :"기수·성명은 RSA 총동문회 연명부에서 확인한 값이며, 그 밖의 항목은 본인이 입력했습니다. 이 동문은 공인중개사사무소 개설등록 정보를 등록하지 않았습니다.";
 return '<div class="card">'
 +'<div style="display:flex;gap:12px;align-items:center"><div class="avatar">'+esc(d.n.slice(0,2))+'</div>'
 +'<div><div style="font-size:20px;font-weight:600">'+esc(d.n)+'</div><div style="font-size:13px;color:var(--tx2)">'+esc(d.o)+'</div></div></div>'
 +'<div style="margin:12px 0"><span class="badge b-ac">RSA '+esc(d.c)+'</span> <span class="badge b-ok">동문 확인</span> <span class="badge b-mut">'+esc(d.j)+'</span></div>'
 +'<div class="hr"></div><table>'
 +'<tr><td class="k">활동지역</td><td class="v">'+area+'</td></tr>'
 +((d.f&&d.f.length)?'<tr><td class="k">전문분야</td><td class="v">'+tags+'</td></tr>':"")
 +'<tr><td class="k">연락처</td><td class="v"><a href="tel:'+esc(d.t)+'" style="color:var(--ac);text-decoration:none">'+esc(d.t)+'</a></td></tr>'
 +((d.p&&d.p.length)?'<tr><td class="k">포럼</td><td class="v">'+esc(d.p.join(" · "))+'</td></tr>':"")
 +(links?'<tr><td class="k">채널</td><td class="v">'+links+'</td></tr>':"")
 +(d.r?'<tr><td class="k">등록번호</td><td class="v">'+esc(d.r)+'</td></tr>':"")
 +'</table>'
 +(pub?'<div class="row" style="margin-top:14px"><a href="tel:'+esc(d.t)+'" style="flex:1;text-decoration:none"><button class="pri full">전화 걸기</button></a></div>':"")
 +'<p class="note">'+foot+'</p></div>';
}

function viewPublic(x){
 var d=dec(x);
 if(!d){app.innerHTML='<h1>열 수 없는 명함입니다</h1><p class="sub">주소가 잘리거나 잘못 전달된 것 같습니다. 보내주신 분께 다시 요청해 주세요.</p>';return}
 app.innerHTML=renderCard(d,true)
 +'<div class="card" style="margin-top:12px"><h2>RSA 총동문회</h2><p class="sub" style="margin:0">전국 동문이 함께하는 부동산 전문가 네트워크입니다.</p></div>'
 +'<p class="note">이 명함은 RSA 총동문회 전자명함 서비스로 만들어졌습니다.</p>';
}

function viewAdmin(){
 var rows=[["김상호","8기","미래공인중개사사무소 · 서울서부","ok","발급됨"],["박연우","9기","한울부동산 · 경기남부","ok","발급됨"],
  ["최우석","9기","인증 3회 실패 · 번호 변경 추정","warn","번호 갱신"],["이정민","10기","아직 만들지 않음","mut","안내 발송"],
  ["한도현","5기","탈퇴 처리 · 링크 닫힘","mut","회수됨"]];
 app.innerHTML='<button class="back" onclick="go(\'\')">← 처음으로</button><h1>사무국 관리</h1><p class="sub">통합 명단 952명 · 정회원 407명 기준입니다.</p>'
 +'<div class="demo">발급 수치는 데모입니다. 인원은 업로드하신 명단 7종을 통합·중복제거한 실제 값입니다.</div>'
 +'<div class="row" style="margin-bottom:12px"><div class="stat"><span style="font-size:13px;color:var(--tx2)">동문 전체</span><b>952</b></div><div class="stat"><span style="font-size:13px;color:var(--tx2)">2026 정회원</span><b>407</b></div></div>'
 +'<div class="card"><h2>기수별 등록</h2>'
 +[["1기",17],["2기",3],["3기",28],["4기",96],["5기",229],["6기",219],["7기",92],["8기",42],["9기",80],["10기",140]].map(function(r){return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--tx2)">'+r[0]+'</span><span>'+r[1]+'명</span></div><div class="bar"><i style="width:'+Math.round(r[1]/229*100)+'%"></i></div></div>'}).join("")
 +'<p class="note">업로드하신 명단 7종을 이름·휴대폰 기준으로 중복 제거한 통합 수치입니다(952명). 이 중 407명이 2026 연명부(rev10)의 정회원이고, 나머지는 과거 수강생·설문 응답자라 연락처가 오래됐을 수 있습니다. 기수 미상 5명은 별도 확인이 필요합니다. 명함 발급은 정회원 여부와 무관하게 동문 전체 952명에게 열려 있습니다.</p></div>'
 +'<div class="card" style="margin-top:12px"><h2>동문 명단</h2>'
 +rows.map(function(r){var cls=r[3]==="ok"?"b-ok":r[3]==="warn"?"b-ac":"b-mut";
   return '<div class="mrow"><div><div style="font-size:14px;font-weight:600">'+r[0]+' <span style="font-weight:400;font-size:12px;color:var(--tx3)">'+r[1]+'</span></div><div style="font-size:12px;color:var(--tx2)">'+r[2]+'</div></div><span class="badge '+cls+'">'+r[4]+'</span></div>'}).join("")
 +'</div><p class="note">번호 갱신은 남의 명함을 대신 만들 수 있는 권한이기도 합니다. 갱신 기록을 남기고 본인 확인을 거치는 운영 규칙을 함께 정해 두세요.</p>';

function route(){
 var h=location.hash.slice(1);
 window.scrollTo(0,0);
 if(h.indexOf("c=")===0)return viewPublic(h.slice(2));
 if(h==="create")return viewCreate();
 if(h==="agree")return viewAgree();
 if(h==="form")return viewForm();
 if(h==="done")return viewDone();
 if(h==="admin")return viewAdmin();
 viewHome();
}
window.addEventListener("hashchange",route);
route();
</script>
